name: Quantum Breakout Live Scanner

on:
  schedule:
    # רץ כל 30 דקות במהלך שעות המסחר בוול סטריט (ימים ב'-ו')
    - cron: '0,30 14-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install six matplotlib yfinance mplfinance pandas numpy requests

      - name: Run Live Breakout Scanner
        run: python breakout_scanner.py

      - name: Save sent tickers memory to repo
        run: |
          git config --global user.name "Quantum Breakout Bot"
          git config --global user.email "bot@github.com"
          git add sent_breakouts.json || true
          git diff --staged --quiet || git commit -m "Update breakout memory cache [skip ci]"
          git push || true
