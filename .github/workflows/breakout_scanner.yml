name: Quantum Breakout Live Scanner

on:
  schedule:
    # רץ כל 30 דקות במהלך שעות המסחר בוול סטריט (13:30 עד 20:30 UTC, ימים ב'-ו')
    - cron: '0,30 13-20 * * 1-5'
  workflow_dispatch: # כפתור הפעלה ידנית לבדיקה מיידית

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache sent alerts today
        uses: actions/cache@v4
        with:
          path: /tmp/sent_breakouts_today.json
          key: breakout-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            breakout-cache-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance mplfinance pandas numpy requests

      - name: Run Live Breakout Scanner
        run: python breakout_scanner.py
