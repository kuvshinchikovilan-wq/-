name: ILAN.KUV Daily Market Poster

on:
  workflow_dispatch: # מאפשר הפעלה ידנית לבדיקה בכל רגע

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance requests playwright
          playwright install --with-deps chromium

      - name: Generate Poster and Send to Discord & WhatsApp
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WHATSAPP_WEBHOOK_URL: ${{ secrets.WHATSAPP_WEBHOOK_URL }}
          TZ: Asia/Jerusalem
        run: python generate_poster.py
