name: Quantum Weekly Support Scanner

on:
  schedule:
    # רץ פעמיים ביום מסחר: 15:00 ו-19:00 UTC (17:00 ו-21:00 שעון ישראל)
    - cron: '0 15,19 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan_supports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance mplfinance pandas numpy requests

      - name: Run Weekly Support Scanner
        run: python weekly_support_scanner.py

      - name: Save memory cache
        run: |
          git config --global user.name "Quantum Support Bot"
          git config --global user.email "bot@github.com"
          git add sent_weekly_supports.json || true
          git diff --staged --quiet || git commit -m "Update weekly support memory [skip ci]"
          git push || true
