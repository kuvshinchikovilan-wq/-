name: Quantum Weekly Support Scanner

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-support-scanner
  cancel-in-progress: true

jobs:
  scan_supports:
    runs-on: ubuntu-latest
    steps:
      - name: Check if US Market is Open (Guard against delayed runs)
        id: market_check
        if: github.event_name == 'schedule'
        run: |
          python3 -c "
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now_ny = datetime.now(ZoneInfo('America/New_York'))
          mins = now_ny.hour * 60 + now_ny.minute
          is_open = (now_ny.weekday() < 5) and (570 <= mins <= 965)
          print(f'NY Time: {now_ny.strftime(\"%Y-%m-%d %H:%M\")} | Market Open: {is_open}')
          with open('$GITHUB_OUTPUT', 'a') as f:
              f.write(f'open={str(is_open).lower()}\n')
          "

      - name: Checkout code
        if: github.event_name == 'workflow_dispatch' || steps.market_check.outputs.open == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: github.event_name == 'workflow_dispatch' || steps.market_check.outputs.open == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || steps.market_check.outputs.open == 'true'
        run: |
          pip install --upgrade pip
          pip install six matplotlib yfinance mplfinance pandas numpy requests

      - name: Run Weekly Support Scanner
        if: github.event_name == 'workflow_dispatch' || steps.market_check.outputs.open == 'true'
        env:
          TZ: Asia/Jerusalem
        run: python weekly_support_scanner.py

      - name: Save memory cache
        if: github.event_name == 'workflow_dispatch' || steps.market_check.outputs.open == 'true'
        run: |
          git config --global user.name "Quantum Support Bot"
          git config --global user.email "bot@github.com"
          git add sent_weekly_supports.json || true
          git diff --staged --quiet || git commit -m "Update weekly support memory [skip ci]"
          git push || true
